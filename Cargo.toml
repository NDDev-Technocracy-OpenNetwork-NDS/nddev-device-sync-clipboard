[package]
name = "nddev-device-sync-clipboard"
version = "0.0.1-alpha.7"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["NDDev OpenNetwork"]
homepage = "https://nddev.ai"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-clipboard"

[dependencies]
serde = { version = "1", features = ["derive"] }
zeroize = "1.8"
tokio = { version = "1.53", features = ["rt", "sync", "time"] }
thiserror = "2"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
nddev-device-sync-adapter-io = { version = "=0.0.1-alpha.4", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-agent", rev = "383b6a06b8500626cc12307ac4e2ae92f7d43c80" }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }

tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[target.'cfg(target_os = "android")'.dependencies]
nddev-device-sync-accounts = { version="=0.0.1-alpha.24", git="https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-accounts", rev="1e65cfb2e03459f3ae4cab92f6a036dd53e2f77c" }
jni = "0.21.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
