name: NDS checks
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: runner.os == 'Linux'
        with:
          bun-version-file: package.json
      - name: Strict browser I/O and generated adapter drift
        if: runner.os == 'Linux'
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run check
          bun run check:generated
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Native transport tests
        run: cargo test --locked --workspace
      - name: Dependency policy and advisory checks
        if: runner.os == 'Linux'
        run: |
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.22.2 cargo-audit
          cargo deny check
          cargo audit
      - name: Fetch verified native provider
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --location --max-time 60 https://raw.githubusercontent.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-agent/341644980976a08825b194f147b7534321325785/scripts/fetch-provider.py --output "$RUNNER_TEMP/fetch-provider.py"
          python3 "$RUNNER_TEMP/fetch-provider.py" provider.lock.json "$RUNNER_TEMP/native-provider"
      - name: Real isolated native provider acceptance
        if: runner.os == 'Linux'
        run: cargo test --locked --test provider -- --ignored

      - name: Browser adapter compile gate
        if: runner.os == 'Linux'
        run: |
          rustup target add --toolchain 1.99.1 wasm32-unknown-unknown
          cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings
