schema = 1
profiles = ["rust"]

[tools.rust]
command = ["rustc", "--version"]
pattern = "^rustc 1[.]99[.]1"

[commands.rust]
lint = ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--", "-D", "warnings"]
test = ["cargo", "test", "--locked", "--workspace"]
build = ["cargo", "build", "--locked", "--workspace", "--release"]
policy = ["cargo", "deny", "--locked", "check", "licenses", "sources"]

[timeouts]
rust = 900

[extras.advisories]
purpose = "Check the locked dependencies against current RustSec advisories"
command = ["cargo", "audit", "--deny", "warnings"]
timeout = 600

[extras.browser-check]
purpose = "TypeScript browser adapter checks and generated-source drift gate"
command = ["just", "browser-check"]
timeout = 300

[extras.wasm-gate]
purpose = "Browser adapter compiles for wasm32-unknown-unknown"
command = ["just", "wasm-check"]
timeout = 300
